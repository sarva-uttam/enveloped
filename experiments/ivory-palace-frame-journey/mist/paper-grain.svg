<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Tileable, near-invisible handmade-paper texture for the Ivory Palace
       mist and finale layers (see METHOD §11): fine grain plus soft,
       low-frequency mottling, both warm sepia at very low alpha. Contains
       no text or imagery. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.24  0 0 0 0.1 -0.03"/>
  </filter>
  <filter id="mottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="9" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.52  0 0 0 0 0.36  0 0 0 0.12 -0.045"/>
  </filter>
  <rect width="240" height="240" filter="url(#mottle)"/>
  <rect width="240" height="240" filter="url(#grain)"/>
</svg>
